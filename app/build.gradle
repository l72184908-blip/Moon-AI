plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moon.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.moon.ai"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            // Default debug signing (fine for v1 — new app, no existing install).
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.material:material:1.11.0'

    // LiteRT-LM — on-device LLM inference (Gemma 3n E2B, .litertlm).
    // Pinned to 0.10.2 (Apr 2026 stable). latest.release resolved to
    // 0.20.0, whose classes are Java 25 bytecode (major version 69) that
    // AGP 8.5.2's R8 cannot dex ("Unsupported class file major version
    // 69"). If the 0.10.2 API differs from the code, the compile error
    // will say so — then adapt the LlmEngine calls or try 0.14.0.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.2'
}
