name: Build Moon AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        env:
          # Bakes the owner's HF token into the APK so friends can
          # download the model without their own token. The secret is
          # never printed or committed; it only exists inside the APK.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moon-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
