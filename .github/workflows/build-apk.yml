name: Build Moon AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download bundled model
        # The model ships INSIDE the APK so the app is ready to use
        # with no download, token or license step. Fetched from a
        # public mirror (no auth needed) and verified by SHA-256 —
        # byte-identical to the canonical Gemma 3 1B int4 file
        # (584,417,280 bytes). The file is NOT committed to the repo.
        run: |
          mkdir -p app/src/main/assets/models
          curl -sL -o app/src/main/assets/models/gemma3-1b-it-int4.litertlm "https://huggingface.co/lotapa/gemma3-1b-it-int4.litertlm/resolve/main/gemma3-1b-it-int4.litertlm"
          echo "1325ae366d31950f137c9c357b9fa89448b176d76998180c08ceaca78bba98be  app/src/main/assets/models/gemma3-1b-it-int4.litertlm" | sha256sum -c -
          ls -l app/src/main/assets/models/

      - name: Build debug APK
        env:
          # Bakes the owner's HF token into the APK so friends can
          # download the model without their own token. The secret is
          # never printed or committed; it only exists inside the APK.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moon-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
